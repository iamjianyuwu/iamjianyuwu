name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/readme-cards.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Set a GRS_TOKEN secret (a PAT) to include private contributions.
      # Without it the card falls back to GITHUB_TOKEN, which can only read
      # public stats, so the private-only options are dropped.
      - name: Generate stats card
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&theme=transparent${{ secrets.GRS_TOKEN && '&count_private=true&include_all_commits=true' || '' }}
          path: profile/stats.svg
          token: ${{ secrets.GRS_TOKEN || secrets.GITHUB_TOKEN }}

      # Never replace a good card with an error card.
      - name: Check card
        run: |
          if grep -q "Something went wrong" profile/stats.svg; then
            grep -o '>[^<>]*<' profile/stats.svg
            exit 1
          fi

      - name: Commit cards
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
