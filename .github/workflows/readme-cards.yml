name: Update README cards

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/readme-cards.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.GRS_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      # GITHUB_TOKEN cannot read stars on the owner's other repos, so the
      # card needs a GRS_TOKEN secret (a PAT with repo and read:user).
      # Until one is set, skip instead of failing every day.
      - name: Skip without GRS_TOKEN
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::GRS_TOKEN is not set, skipping stats card"

      - name: Generate stats card
        if: env.HAS_TOKEN == 'true'
        uses: readme-tools/github-readme-stats-action@v1
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&count_private=true&include_all_commits=true&hide_border=true&theme=transparent
          path: profile/stats.svg
          token: ${{ secrets.GRS_TOKEN }}

      # Never replace a good card with an error card.
      - name: Check card
        if: env.HAS_TOKEN == 'true'
        run: |
          if grep -q "Something went wrong" profile/stats.svg; then
            grep -o '>[^<>]*<' profile/stats.svg
            exit 1
          fi

      - name: Commit cards
        if: env.HAS_TOKEN == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
